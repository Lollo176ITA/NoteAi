org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.code.style=official
ksp.useKSP2=true

# AGP 9 Built-in Kotlin Support: KSP registra sorgenti via kotlin.sourceSets,
# mentre AGP 9 vorrebbe android.sourceSets. Tolleriamolo finche KSP non si allinea.
android.disallowKotlinSourceSets=false
